<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Counter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<title>Money Counter</title>
</head>
<body>
<div id="app" class="app hidden">

  <div class="rain" id="rain" aria-hidden="true"></div>
  <div class="glass2" id="glass2" aria-hidden="true"></div>

  <div class="track" id="track">

    <section class="panel" aria-label="Historia">
      <button class="cal" id="cal" aria-label="Zmień zakres historii">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span id="calLabel">14 dni</span>
      </button>
      <div class="scroll" id="hist"></div>
    </section>

    <section class="panel" aria-label="Home">
      <button class="pill" id="pill"><span class="pi" id="pillIco"></span><span id="pillText"></span></button>
      <button class="rnd l" id="addIn" aria-label="Dodaj przychód">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="#fff" stroke-width="1" aria-hidden="true"><path d="M22 4v36M4 22h36"/></svg>
      </button>
      <button class="rnd r" id="addOut" aria-label="Dodaj wydatek">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="#fff" stroke-width="1" aria-hidden="true"><path d="M4 22h36"/></svg>
      </button>
    </section>

    <section class="panel" aria-label="Koszty stałe">
      <div class="flist" id="flist"></div>
      <div class="ftotal">razem miesięcznie: <b id="fsum">0 zł</b></div>
    </section>

  </div>

  <div class="bal" id="bal" role="status"><span id="balInner"></span></div>

  <button class="accbtn" id="accBtn" aria-label="Konta">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M6 15h4"/></svg>
  </button>
  <div class="accinfo" id="accInfo"></div>
  <button class="gear" id="gear" aria-label="Ustawienia">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>

  <nav class="nav" id="nav">
    <button data-i="0" aria-label="Historia wydatków">
      <svg width="28" height="28" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.5 13a8.5 8.5 0 1 0 2.5-6"/><path d="M4 4v4h4"/><path d="M13 8.5V13l3 2"/></svg>
    </button>
    <button data-i="1" aria-label="Home">
      <svg width="28" height="28" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12L13 5l8.5 7v8.5h-5.5v-5h-6v5H4.5z"/></svg>
    </button>
    <button data-i="2" aria-label="Koszty stałe">
      <svg width="28" height="28" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="7.5" r="1.6"/><circle cx="6" cy="13" r="1.6"/><circle cx="6" cy="18.5" r="1.6"/><path d="M11 7.5h10M11 13h10M11 18.5h10"/></svg>
    </button>
    <span class="uline" id="uline" aria-hidden="true"></span>
  </nav>

</div>
<script src="app.js"></script>
</body>
</html>
